<title>IT-помощь Dusit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Лобби: тёплый светлый фон, изумрудный акцент, латунь для меток; одна колонка под телефон */
:root{
  --bg:#F6F1E8; --surface:#FFFDF8; --line:#E4DCCD; --chip:#EDE5D6;
  --ink:#1F2A27; --ink-2:#3E4A46; --muted:#5E6863;
  --accent:#1F4D45; --on-accent:#F6F1E8; --brass:#8A5F27;
  --warn-bg:#F3E6CF; --warn-line:#E2CBA2; --warn-ink:#4A3518; --ok:#2F6B4F;
  --urgent-bg:#F6E1DA; --urgent-line:#E3B7A8; --urgent-ink:#6B2414;
  --shadow:0 6px 18px rgba(60,45,20,.07);
  --f-display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --f-body:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201D; --line:#2A3430; --chip:#202A26;
  --ink:#EEE8DC; --ink-2:#CFC8BB; --muted:#9AA39E;
  --accent:#86BFAE; --on-accent:#0F1513; --brass:#D2A564;
  --warn-bg:#2A2216; --warn-line:#4A3B22; --warn-ink:#F0DDB8; --ok:#86C9A2;
  --urgent-bg:#2E1A15; --urgent-line:#5A2E22; --urgent-ink:#F3C5B6;
  --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201D; --line:#2A3430; --chip:#202A26;
  --ink:#EEE8DC; --ink-2:#CFC8BB; --muted:#9AA39E;
  --accent:#86BFAE; --on-accent:#0F1513; --brass:#D2A564;
  --warn-bg:#2A2216; --warn-line:#4A3B22; --warn-ink:#F0DDB8; --ok:#86C9A2;
  --urgent-bg:#2E1A15; --urgent-line:#5A2E22; --urgent-ink:#F3C5B6;
  --shadow:0 6px 18px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:6px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 28px;min-height:100vh;display:flex;flex-direction:column}
.wrap.big{zoom:1.15}
.view{display:flex;flex-direction:column;gap:22px;flex:1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brass{color:var(--brass)}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.topbar .r{display:flex;align-items:center;gap:8px}
.size-btn{min-width:44px;height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1;cursor:pointer}
.size-btn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.offline{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted)}
.offline::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brass)}
h1,h2{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:44px;line-height:1.02}
h1 em,h2 em{font-style:italic;font-weight:500;color:var(--accent)}
.lead{margin:6px 0 0;font-size:14px;color:var(--muted);max-width:40ch}
.search{display:flex;align-items:center;gap:12px;height:54px;padding:0 8px 0 20px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:var(--ink);font:500 16px var(--f-body)}
.search input::placeholder{color:var(--muted)}
.icon-btn[disabled]{opacity:.3;cursor:default}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.row:last-child{border-bottom:0}
.row .ic{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent)}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.row .nm{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.15}
.row .sub{font-size:13px;color:var(--muted)}
.row .nm.small{font-family:var(--f-body);font-weight:600;font-size:16px;line-height:1.35}
.row .chev{flex:none;color:var(--brass)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:var(--chip);color:var(--ink);font-size:14px;font-weight:500;text-decoration:none;border:0;cursor:pointer}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 20px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;text-decoration:none;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.small{min-height:44px;font-size:14px;padding:0 16px}
.back{align-self:flex-start;display:flex;align-items:center;gap:6px;min-height:44px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none}
.card-head{display:flex;flex-direction:column;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.card-head h2{font-size:38px;line-height:1.04}
.card-head p{margin:0;font-size:15px;color:var(--ink-2)}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.pill.draft{background:var(--warn-bg);color:var(--warn-ink);border:1px solid var(--warn-line)}
.pill.stale{background:var(--urgent-bg);color:var(--urgent-ink);border:1px solid var(--urgent-line)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.progress{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.progress .bar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);transition:width .2s ease}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.step{border-bottom:1px solid var(--line)}
.step:last-child{border-bottom:0}
.stepbtn{width:100%;display:flex;gap:16px;padding:16px 0;background:transparent;border:0;text-align:left;cursor:pointer}
.num{flex:none;width:34px;font-family:var(--f-display);font-style:italic;font-weight:500;font-size:36px;line-height:.9;color:var(--brass)}
.step .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.step .t{font-weight:700;font-size:16px;line-height:1.35}
.step .d{font-size:14px;color:var(--muted)}
.step.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.step.done .num{color:var(--ok)}
.step .tick{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:transparent;margin-top:2px}
.step.done .tick{background:var(--ok);border-color:var(--ok);color:var(--bg)}
.final{display:flex;gap:16px;padding:16px 0;align-items:center}
.photo{display:block;border-radius:6px;overflow:hidden;margin-top:4px}
.photo img{display:block;width:100%;height:auto}
.photo.full{margin:0 0 16px}
.photo.ph{height:120px;background:var(--chip);border:1px dashed var(--warn-line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;padding:0 12px}
.warn,.urgent{display:flex;gap:12px;padding:14px 16px;border-radius:8px;font-size:14px}
.warn{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn-ink)}
.warn svg{flex:none;margin-top:1px;color:var(--brass)}
.urgent{background:var(--urgent-bg);border:1px solid var(--urgent-line);color:var(--urgent-ink);font-weight:600}
.urgent svg{flex:none;margin-top:1px}
.fix{display:flex;gap:12px;padding:14px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--accent);color:var(--ink);font-size:14px}
.fix svg{flex:none;margin-top:1px;color:var(--accent)}
.fix b{display:block;font-size:15px;margin-bottom:2px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.notebox{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.notebox p{margin:0;font-size:14px;color:var(--ink-2)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg span{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:600;cursor:pointer;transition:background .15s,color .15s}
.seg input:checked+span{background:var(--accent);color:var(--on-accent)}
.seg input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
.msg{white-space:pre-wrap;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.contrib{display:flex;align-items:center;gap:14px;padding:16px;border-radius:14px;border:1.5px dashed var(--brass);background:var(--surface);color:var(--ink);text-decoration:none}
.contrib .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.contrib .tx b{font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.15}
.contrib .tx span{font-size:13px;color:var(--muted)}
.contrib-ic{flex:none;width:40px;height:40px;border-radius:50%;background:var(--warn-bg);color:var(--brass);display:flex;align-items:center;justify-content:center}
.contrib .chev{flex:none;color:var(--brass)}
.more-link{display:inline-flex;align-items:center;min-height:44px;margin-top:6px;font-size:14px;font-weight:600;color:var(--brass)}
.mine{display:flex;flex-direction:column;gap:8px}
.mine-item{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:10px;background:var(--chip);font-size:14px}
.mine-item span{color:var(--ink-2);overflow-wrap:anywhere}
.alts{display:flex;flex-direction:column;gap:8px}
.alt{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.alt p{margin:0;font-size:15px}
.alt span{font-size:12px;color:var(--muted)}
.credits{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.credits svg{flex:none;color:var(--brass)}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{font-size:13px;color:var(--muted);text-align:center}
.panel{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.panel .big{font-family:var(--f-display);font-weight:600;font-size:32px;line-height:1;user-select:all;font-variant-numeric:tabular-nums}
.thanks{display:flex;align-items:center;gap:10px;padding:16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--ok);font-weight:600}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px}
.banner .tx{flex:1;min-width:0}
.empty{padding:18px 0;color:var(--muted);font-size:15px}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding-top:12px;font-size:12px;color:var(--muted)}
.foot a{color:var(--muted)}
.stat{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.stat b{font-variant-numeric:tabular-nums;flex:none}
.stat .q{min-width:0;overflow-wrap:anywhere;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.stat a{font-size:13px;font-weight:600;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint,.hint{font-size:12px;color:var(--muted)}
.field input,.field textarea{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.field textarea{min-height:96px;resize:vertical;line-height:1.45}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--chip);font-size:14px;font-weight:500;cursor:pointer}
.code{width:100%;min-height:200px;font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);white-space:pre;overflow:auto}
.qr{display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px;border-radius:14px;background:#FFFFFF;border:1px solid var(--line);color:#1F2A27;text-align:center}
.qr img{width:240px;height:240px;image-rendering:pixelated}
.qr .qt{font-family:var(--f-display);font-weight:600;font-size:26px;line-height:1.1}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>

<div id="app" class="wrap" aria-live="polite"></div>

<script>
/* =====================================================================
   КОНТЕНТ. Правила — в CLAUDE.md. Карточку удобнее собирать в «Для IT» → «Новая карточка».

/* --- поиск: русские окончания, синонимы, опечатки --- */
const STOP = new Set(['и','в','во','на','у','с','со','что','как','а','по','это','очень','просто','уже','опять','снова','мой','моя','меня','при','для','из','к','от','до','не','нет','ни','все','всё','работает','работают','работал','работать','сломался','сломалось','сломалась','сломан','проблема','помогите','почему','что-то','плохо']);
const ENDS = ['иями','ями','ами','ого','его','ому','ему','ыми','ими','ает','яет','ует','ешь','ете','ишь','ите','ют','ут','ат','ят','ет','ит','ом','ем','ой','ей','ий','ый','ая','яя','ое','ее','ые','ие','ов','ев','ах','ях','ам','ям','ть','а','я','о','е','ы','и','у','ю','ь','й'];
function stem(w){
  if (w.length > 4 && (w.endsWith('ся') || w.endsWith('сь'))) w = w.slice(0,-2);
  if (w.length <= 3) return w;
  for (const e of ENDS) if (w.endsWith(e) && w.length - e.length >= 3) return w.slice(0, -e.length);
  return w;
}
const words = s => String(s).toLowerCase().replace(/ё/g,'е').replace(/wi-?fi/g,'вайфай').replace(/[^a-zа-я0-9]+/g,' ').trim().split(' ').filter(Boolean);
const SYN = [
  ['телевизор','тв','телик','экран','телевизоры'],
  ['принтер','печать','печатает','распечатать','распечатка','чек','чеки','лента'],
  ['касса','кассы','симфони','simphony','pos','атол','фискал','фискальный'],
  ['эквайринг','терминал','пинпад','сбер','оплата'],
  ['браслет','браслеты','ключ','карта','карточка','пропуск','замок','дверь','открывает','открыть'],
  ['телефон','трубка','радиотелефон','звонок','сигнал','связь','ловит'],
  ['вайфай','wifi','интернет','сеть','инет','подключение','подключается'],
  ['завис','висит','зависает','тормозит','глючит','застрял'],
  ['компьютер','комп','пк','ноутбук','ноут'],
  ['пропадает','отваливается','обрывается','теряет','пропал']
];
const SYNMAP = new Map();
SYN.forEach((g, i) => g.forEach(w => SYNMAP.set(stem(w), i)));
const expand = st => SYNMAP.has(st) ? SYN[SYNMAP.get(st)].map(stem) : [st];
function lev(a, b, max){
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({length:b.length+1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++){
    const cur = [i]; let best = i;
    for (let j = 1; j <= b.length; j++){
      cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      if (cur[j] < best) best = cur[j];
    }
    if (best > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
let INDEX = [];
const buildIndex = () => { INDEX = CARDS.map(c => {
  const m = new Map();
  const add = (txt, w) => words(txt).forEach(x => { const s = stem(x); if (!STOP.has(x)) m.set(s, Math.max(m.get(s) || 0, w)); });
  add(c.title, 3); add(c.keywords, 2); add(c.symptom, 2); add(c.device, 2);
  (c.steps || []).forEach(s => add(s.t + ' ' + (s.d || ''), 1));
  return { card:c, terms:m };
}); };
buildIndex();
function search(q){
  const qs = words(q).filter(w => !STOP.has(w)).map(stem);
  if (!qs.length) return [];
  const out = [];
  for (const doc of INDEX){
    let score = 0, hit = 0;
    for (const s of qs){
      let best = 0;
      for (const v of expand(s)){
        const syn = v === s ? 1 : 0.6;
        for (const [t, w] of doc.terms){
          let k = 0;
          if (t === v) k = 1;
          else if (v.length >= 3 && t.startsWith(v)) k = .8;
          else if (v.length >= 4){ const max = v.length >= 7 ? 2 : 1; if (lev(v, t, max) <= max) k = .6; }
          if (k * w * syn > best) best = k * w * syn;
        }
      }
      if (best > 0){ score += best; hit++; }
    }
    if (hit >= Math.ceil(qs.length / 2)) out.push({ card:doc.card, score: score + hit });
  }
  out.sort((a, b) => b.score - a.score);
  const top = out.length ? out[0].score : 0;
  return out.filter(r => r.score >= top * 0.6).map(r => r.card);
}

function wireSteps(){
  const list = document.getElementById('steps'); if (!list) return;
  const items = [...list.querySelectorAll('.step')];
  const upd = () => {
    const n = items.filter(x => x.classList.contains('done')).length;
    document.getElementById('pg').textContent = `${n} из ${items.length}`;
    document.getElementById('pgbar').style.width = (items.length ? n / items.length * 100 : 0) + '%';
  };
  items.forEach(li => li.querySelector('button').addEventListener('click', e => {
    const on = li.classList.toggle('done');
    e.currentTarget.setAttribute('aria-pressed', on);
    upd();
  }));
}

function copyText(text, btn, okLabel){
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.className = 'code'; ta.style.minHeight = '120px'; ta.value = text; ta.readOnly = true;
    const old = document.getElementById('copy-fallback'); if (old) old.remove();
    ta.id = 'copy-fallback'; ta.style.width = '100%';
    (btn.closest('.actions') || btn).insertAdjacentElement('afterend', ta); ta.focus(); ta.select();
    btn.textContent = 'Выделите текст и скопируйте';
  };
  try { navigator.clipboard.writeText(text).then(() => { btn.textContent = okLabel; }).catch(fallback); }
  catch(e){ fallback(); }
}

/* --- редактор карточек (Для IT → Редактор). Правки хранятся на этом устройстве, экспорт — в cards.json --- */
const slug = s => { const t = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'y',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ы:'y',э:'e',ю:'yu',я:'ya',ь:'',ъ:''};
  return String(s).toLowerCase().split('').map(ch => t[ch] ?? ch).join('').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0, 40) || 'card'; };
const uniqueId = base => { let id = base, n = 2; while (byId(id)) id = `${base}-${n++}`; return id; };
const nowYM = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; };
let flash = '';
function saveCards(list){
  if (!store.set('cards', list)) return false;
  CARDS = list; buildIndex(); return true;
}
function validCards(x){
  return Array.isArray(x) && x.length && x.every(c => c && typeof c.id === 'string' && typeof c.title === 'string' && Array.isArray(c.steps) && Array.isArray(c.depts));
}

/* сжатие фото: длинная сторона до 1000 px, JPEG — чтобы влезало в память телефона */
function compressPhoto(file){
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const k = Math.min(1, 1000 / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.78));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

      <div class="field"><label>Шаги</label><div id="steps-ed" style="display:flex;flex-direction:column;gap:12px"></div>
        <button class="btn small ghost" type="button" id="add-step">Добавить шаг</button></div>
      <div class="field"><label for="e-done">Как понять, что готово</label><input id="e-done" data-k="done" value="${val('done')}"></div>
      <div class="field"><label for="e-warn">Чего делать нельзя</label><input id="e-warn" data-k="warn" value="${val('warn')}"></div>
      <div class="field"><label for="e-tell">Что сказать IT, если не помогло</label><input id="e-tell" data-k="tell" value="${val('tell')}"></div>
      <div class="field"><label for="e-min">Сколько минут займёт</label><input id="e-min" data-k="minutes" type="number" min="1" max="30" inputmode="numeric" value="${val('minutes')}"></div>
      <div class="field"><label for="e-alts">Ещё помогало коллегам</label><textarea id="e-alts" placeholder="Способ | Имя, отдел">${esc((ed.alts || []).map(a => a.by ? a.text + ' | ' + a.by : a.text).join('\n'))}</textarea><span class="hint">Один способ на строку, автор через «|».</span></div>
      <div class="field"><label for="e-credits">Инструкцию дополнили</label><input id="e-credits" value="${esc((ed.credits || []).join('; '))}" placeholder="Мария, HK; Олег, бар"><span class="hint">Через точку с запятой. Видно внизу карточки.</span></div>
      <div class="checks">
        <label><input type="checkbox" data-flag="urgent" ${ed.urgent ? 'checked' : ''}>Останавливает работу</label>
        <label><input type="checkbox" data-flag="popular" ${ed.popular ? 'checked' : ''}>В «Часто ищут»</label>
        <label><input type="checkbox" id="e-checked" ${ed.checked ? 'checked' : ''}>Проверил на месте${ed.checked ? ' (' + esc(ed.checked) + ')' : ''}</label>
      </div>
    </form>
    <span id="err" class="note" style="color:var(--urgent-ink)" aria-live="polite"></span>
    <div class="actions"><button class="btn" type="button" id="save">Сохранить</button><button class="btn ghost" type="button" id="pvb">Предпросмотр</button></div>
    <div id="pv"></div>
    ${!isNew ? `<div class="actions"><button class="btn small ghost" type="button" id="dup">Дублировать</button><button class="btn small ghost" type="button" id="del">Удалить</button></div>` : ''}
    ${footer()}</div>`;

  const stepsBox = document.getElementById('steps-ed');
  const renderSteps = () => {
    stepsBox.innerHTML = ed.steps.map((s, i) => `<div class="panel" data-i="${i}" style="gap:10px;box-shadow:none">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
        <span class="num" style="font-size:28px">${i+1}</span>
        <span style="display:flex;gap:4px">
          <button class="icon-btn" type="button" data-act="up" aria-label="Шаг выше" ${i === 0 ? 'disabled' : ''}>${ic('up',18)}</button>
          <button class="icon-btn" type="button" data-act="down" aria-label="Шаг ниже" ${i === ed.steps.length-1 ? 'disabled' : ''}>${ic('down',18)}</button>
          <button class="icon-btn" type="button" data-act="rm" aria-label="Удалить шаг">${ic('x',18)}</button>
        </span></div>
      <div class="field"><label for="s-t-${i}">Действие</label><input id="s-t-${i}" data-st="t" value="${esc(s.t)}" placeholder="Выключите телевизор из розетки"></div>
      <div class="field"><label for="s-d-${i}">Пояснение</label><input id="s-d-${i}" data-st="d" value="${esc(s.d || '')}"></div>
      ${s.photo ? `<span class="photo"><img src="${esc(s.photo)}" alt="Фото к шагу ${i+1}"></span>` : ''}
      <div class="actions">
        <label class="btn small ghost" for="s-p-${i}">${s.photo ? 'Заменить фото' : 'Добавить фото'}</label>
        ${s.photo ? `<button class="btn small ghost" type="button" data-act="nophoto">Убрать фото</button>` : ''}
      </div>
      <input id="s-p-${i}" type="file" accept="image/*" data-photo hidden>
    </div>`).join('');
  };
  renderSteps();

  const f = document.getElementById('f');
  f.addEventListener('submit', e => e.preventDefault());
  f.addEventListener('input', e => {
    const t = e.target;
    if (t.id === 'e-alts') ed.alts = t.value.split('\n').map(l => l.trim()).filter(Boolean).map(l => { const [text, by] = l.split('|').map(x => x.trim()); return by ? { text, by } : { text }; });
    if (t.id === 'e-credits') ed.credits = t.value.split(';').map(x => x.trim()).filter(Boolean);
    if (t.dataset.k) ed[t.dataset.k] = t.dataset.k === 'minutes' ? Math.max(1, parseInt(t.value, 10) || 1) : t.value;
    const box = t.closest('[data-i]');
    if (box && t.dataset.st){ const s = ed.steps[+box.dataset.i]; if (t.value) s[t.dataset.st] = t.value; else delete s[t.dataset.st]; if (t.dataset.st === 't') s.t = t.value; }
  });
  f.addEventListener('change', async e => {
    const t = e.target;
    if (t.dataset.dept) ed.depts = [...f.querySelectorAll('[data-dept]:checked')].map(x => x.dataset.dept);
    if (t.dataset.flag){ if (t.checked) ed[t.dataset.flag] = true; else delete ed[t.dataset.flag]; }
    if (t.id === 'e-checked') ed.checked = t.checked ? (src && src.checked && !isStale(src) ? src.checked : nowYM()) : null;
    if (t.dataset.photo !== undefined && t.files[0]){
      const i = +t.closest('[data-i]').dataset.i;
      try { ed.steps[i].photo = await compressPhoto(t.files[0]); delete ed.steps[i].photoHint; }
      catch(err){ document.getElementById('err').textContent = 'Не получилось открыть фото. Попробуйте другое.'; }
      renderSteps();
    }
  });
  stepsBox.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    const i = +b.closest('[data-i]').dataset.i, st = ed.steps;
    if (b.dataset.act === 'up' && i > 0) [st[i-1], st[i]] = [st[i], st[i-1]];
    if (b.dataset.act === 'down' && i < st.length-1) [st[i+1], st[i]] = [st[i], st[i+1]];
    if (b.dataset.act === 'rm'){ st.splice(i, 1); if (!st.length) st.push({ t:'' }); }
    if (b.dataset.act === 'nophoto') delete st[i].photo;
    renderSteps();
  });
  document.getElementById('add-step').onclick = () => {
    if (ed.steps.length >= 5) document.getElementById('err').textContent = 'Больше 5 шагов персонал не дочитает. Лучше разбить на две карточки.';
    ed.steps.push({ t:'' }); renderSteps();
    const last = document.getElementById(`s-t-${ed.steps.length-1}`); if (last) last.focus();
  };
  const clean = () => {
    const c = JSON.parse(JSON.stringify(ed));
    c.title = c.title.trim(); c.steps = c.steps.filter(s => s.t && s.t.trim());
    if (!c.depts.length) c.depts = ['reception'];
    if (!(c.alts || []).length) delete c.alts;
    if (!(c.credits || []).length) delete c.credits;
    ['done','warn','tell','device','symptom','keywords'].forEach(k => { if (typeof c[k] === 'string') c[k] = c[k].trim(); if (c[k] === '' && ['done','warn','tell'].includes(k)) delete c[k]; });
    return c;
  };
  document.getElementById('pvb').onclick = () => {
    const c = clean();
    document.getElementById('pv').innerHTML = c.steps.length ? `<div class="panel" style="gap:18px">${cardBody(c)}</div>` : '';
    wireSteps();
  };
  document.getElementById('save').onclick = () => {
    const c = clean(), err = document.getElementById('err');
    if (!c.title){ err.textContent = 'Напишите, как называется проблема.'; document.getElementById('e-title').focus(); return; }
    if (!c.steps.length){ err.textContent = 'Добавьте хотя бы один шаг.'; return; }
    if (isNew) c.id = uniqueId(slug(c.title));
    const list = isNew ? [...CARDS, c] : CARDS.map(x => x.id === c.id ? c : x);
    if (!saveCards(list)){ err.textContent = 'Не хватило памяти телефона. Уберите часть фото или снимайте с меньшим разрешением.'; return; }
    flash = `Сохранено: ${c.title}`; location.hash = 'admin';
  };
  const dup = document.getElementById('dup');
  if (dup) dup.onclick = () => {
    const c = clean(); c.id = uniqueId(c.id + '-copy'); c.title += ' (копия)'; c.checked = null;
    if (!saveCards([...CARDS, c])){ document.getElementById('err').textContent = 'Не хватило памяти телефона.'; return; }
    location.hash = 'edit-' + c.id;
  };
  const del = document.getElementById('del');
  if (del) del.onclick = () => {
    if (!del.dataset.armed){ del.dataset.armed = '1'; del.textContent = 'Точно удалить?'; return; }
    store.set('deleted', [...new Set([...store.get('deleted', []), ed.id])]);
    saveCards(CARDS.filter(x => x.id !== ed.id)); flash = `Удалено: ${ed.title}`; location.hash = 'admin';
  };
}

      <div class="field"><label>Насколько срочно</label><div class="checks">
        <label><input type="radio" name="urg" value="Работа стоит, гости ждут" ${c && c.urgent ? 'checked' : ''}>Работа стоит</label>
        <label><input type="radio" name="urg" value="Можно в течение дня" ${c && c.urgent ? '' : 'checked'}>Можно подождать</label></div></div>

    ${footer()}</div>`;

    g('t-out').textContent = text;
    g('t-tg').href = 'https://t.me/share/url?url=' + encodeURIComponent(text);

/* --- предложения от персонала: «Знаете способ лучше?» → сообщение IT с кодом → импорт в редактор --- */
const KINDS = { other:'Помогло другое', fix:'Поправить шаг', add:'Добавить шаг', new:'Новая проблема' };
const encSug = o => 'DH1.' + btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const decSug = s => { const m = String(s).replace(/\s+/g, '').match(/DH1\.([A-Za-z0-9+/=]+)/); if (!m) return null; try { return JSON.parse(decodeURIComponent(escape(atob(m[1])))); } catch(e){ return null; } };
let pendingPrefill = null;

function viewSuggest(arg){
  const isNew = !arg || arg === 'new';
  const c = isNew ? null : byId(arg);
  if (!isNew && !c) return viewHome();
  const me = store.get('me', {});
  const kinds = isNew ? ['new'] : ['other','fix','add'];
  app.innerHTML = `<div class="view">
    ${backLink(c ? 'c-' + c.id : 'home', 'Назад')}
    <div class="card-head"><span class="eyebrow brass">Пополнить базу</span>
      <h2>${c ? 'Знаете способ <em>лучше?</em>' : 'Расскажите, <em>как решили</em>'}</h2>
      <p>${c ? `«${esc(c.title)}». ` : ''}IT проверит ваш способ и добавит его в инструкцию, а ваше имя появится в карточке.</p></div>
    <form id="sg" style="display:flex;flex-direction:column;gap:18px" novalidate>
      ${kinds.length > 1 ? `<div class="field"><label>Что хотите предложить</label><div class="seg">${kinds.map((k, i) => `<label><input type="radio" name="kind" value="${k}" ${i === 0 ? 'checked' : ''}><span>${KINDS[k]}</span></label>`).join('')}</div></div>` : ''}
      ${isNew ? `<div class="field"><label for="sg-title">Что сломалось</label><input id="sg-title" value="${esc(lastQuery.trim())}" placeholder="Не включается кофемашина в лобби"></div>` : ''}
      ${c ? `<div class="field" id="sg-steps" hidden><label>Какой шаг</label><div class="seg">${c.steps.map((s, i) => `<label><input type="radio" name="step" value="${i+1}" ${i === 0 ? 'checked' : ''}><span>Шаг ${i+1}</span></label>`).join('')}</div><span class="hint" id="sg-steptext"></span></div>` : ''}
      <div class="field"><label for="sg-text" id="sg-label">${isNew ? 'Как вы это решили' : 'Что вы сделали'}</label>
        <textarea id="sg-text" placeholder="Каждое действие с новой строки"></textarea>
        <span class="hint">Пишите так, как объяснили бы коллеге. Фото можно отправить следом в тот же чат.</span></div>
      <div class="field"><label for="sg-who">Кто предлагает</label><input id="sg-who" value="${esc(me.who || '')}" placeholder="Имя, отдел"><span class="hint">Запомнится на этом телефоне.</span></div>
    </form>
    <div class="eyebrow">Сообщение для IT</div>
    <div class="panel"><div id="sg-out" class="msg"></div><span class="hint">В конце добавится служебный код, по нему IT добавит ваш способ в один клик.</span></div>
    <span id="sg-err" class="note" style="color:var(--urgent-ink)" aria-live="polite"></span>
    <div class="actions"><a class="btn small" id="sg-tg" href="#" target="_blank" rel="noopener">Отправить в Telegram</a><button class="btn small ghost" type="button" id="sg-cp">Скопировать</button></div>
    <div id="sg-done" hidden class="thanks">${ic('check',20,2)}Спасибо! Когда IT проверит способ, он появится в инструкции с вашим именем.</div>
    <a class="btn ghost" href="#${c ? 'c-' + c.id : 'home'}">${c ? 'Вернуться к инструкции' : 'На главную'}</a>
    ${footer()}</div>`;
  const g = id => document.getElementById(id);
  const data = () => {
    const kind = (document.querySelector('[name="kind"]:checked') || {}).value || 'new';
    const step = kind === 'fix' ? +((document.querySelector('[name="step"]:checked') || {}).value || 1) : null;
    const lines = g('sg-text').value.split('\n').map(x => x.trim()).filter(Boolean);
    return { v:1, kind, card: c ? c.id : null, title: isNew ? g('sg-title').value.trim() : c.title, step, lines, by: g('sg-who').value.trim(), at: new Date().toISOString().slice(0,10) };
  };
  const upd = () => {
    const d = data();
    if (c){
      g('sg-steps').hidden = d.kind !== 'fix';
      g('sg-label').textContent = d.kind === 'fix' ? 'Как сделать этот шаг правильно' : d.kind === 'add' ? 'Какой шаг добавить' : 'Что вы сделали';
      g('sg-steptext').textContent = d.step ? 'Сейчас написано: ' + c.steps[d.step-1].t : '';
    }
    const head = d.kind === 'new' ? `Новая проблема: ${d.title || '—'}` : `${KINDS[d.kind]}${d.step ? ' (шаг ' + d.step + ')' : ''}: ${d.title}`;
    const body = [`Предложение в IT-помощь · ${CONFIG.hotel}`, head, ...(d.lines.length ? d.lines.map((l, i) => `${i+1}. ${l}`) : ['—']), `От: ${d.by || '—'}`].join('\n');
    g('sg-out').textContent = body;
    const full = body + '\n\nКод для редактора: ' + encSug(d);
    g('sg-tg').href = 'https://t.me/share/url?url=' + encodeURIComponent(full);
    store.set('me', Object.assign(store.get('me', {}), { who: g('sg-who').value }));
    return { d, full };
  };
  const valid = () => {
    const { d } = upd();
    const err = d.kind === 'new' && !d.title ? 'Напишите, что сломалось.' : !d.lines.length ? 'Напишите хотя бы одно действие.' : '';
    g('sg-err').textContent = err; return !err;
  };
  const finish = () => {
    const { d } = upd();
    const mine = store.get('mysug', []).filter(x => !(x.card === d.card && x.kind === d.kind && x.lines.join() === d.lines.join()));
    mine.unshift(d); store.set('mysug', mine.slice(0, 30));
    g('sg-done').hidden = false;
  };
  g('sg').addEventListener('input', upd); g('sg').addEventListener('change', upd); g('sg').addEventListener('submit', e => e.preventDefault());
  g('sg-tg').addEventListener('click', e => { if (!valid()){ e.preventDefault(); return; } finish(); });
  g('sg-cp').onclick = () => { if (!valid()) return; copyText(upd().full, g('sg-cp'), 'Скопировано'); finish(); };
  upd();
}

/* блок внизу карточки: позвать подсказать + свои ещё не проверенные предложения */
function contribBlock(c){
  const done = new Set((c.alts || []).map(a => a.text));
  const mine = store.get('mysug', []).filter(x => x.card === c.id && !done.has(x.lines.join('. ')));
  return `${mine.length ? `<div class="mine"><span class="eyebrow">Ваши предложения · ждут проверки IT</span>
      ${mine.map(m => `<div class="mine-item"><b>${esc(KINDS[m.kind])}${m.step ? ', шаг ' + m.step : ''}</b><span>${esc(m.lines.join(' → '))}</span></div>`).join('')}</div>` : ''}
    <a class="contrib" href="#suggest-${c.id}">
      <span class="contrib-ic">${ic('bulb',20)}</span>
      <span class="tx"><b>Знаете способ лучше?</b><span>Подскажите IT, и он появится в этой инструкции</span></span>
      <span class="chev">${ic('chev',18)}</span></a>`;
}

/* редактор: вставил сообщение из Telegram → открылась карточка с подставленным предложением */
function importPanel(){
  return `<div class="panel">
    <span class="eyebrow">Предложение от персонала</span>
    <textarea class="code" id="sgin" style="min-height:90px;white-space:pre-wrap" placeholder="Вставьте сообщение из Telegram целиком" aria-label="Сообщение с предложением"></textarea>
    <button class="btn small" type="button" id="sgparse">Разобрать</button>
    <div id="sgres" aria-live="polite"></div></div>`;
}
function wireImport(){
  const btn = document.getElementById('sgparse'); if (!btn) return;
  btn.onclick = () => {
    const d = decSug(document.getElementById('sgin').value), res = document.getElementById('sgres');
    if (!d){ res.innerHTML = '<div class="note">Не нашёл код «DH1.…». Вставьте сообщение целиком, вместе со строкой «Код для редактора».</div>'; return; }
    const target = d.kind !== 'new' && byId(d.card) ? d.card : 'new';
    res.innerHTML = `<div class="mine-item"><b>${esc(KINDS[d.kind] || '')}${d.step ? ', шаг ' + d.step : ''} · ${esc(d.title || '')}</b>
      <span>${esc((d.lines || []).join(' → '))}</span><span class="hint">От: ${esc(d.by || '—')} · ${esc(d.at || '')}</span></div>
      <a class="btn small" href="#edit-${target}" id="sgopen">${target === 'new' ? 'Создать карточку' : 'Открыть карточку с предложением'}</a>`;
    document.getElementById('sgopen').addEventListener('click', () => { pendingPrefill = d; });
  };
}
function applyPrefill(ed, isNew, id){
  const p = pendingPrefill;
  if (!p) return '';
  const fits = isNew ? (p.kind === 'new' || !byId(p.card)) : p.card === id;
  if (!fits) return '';
  pendingPrefill = null;
  const lines = p.lines || [];
  if (p.kind === 'new' || isNew){ ed.title = p.title || ''; ed.steps = lines.length ? lines.map(t => ({ t })) : [{ t:'' }]; }
  else if (p.kind === 'add') lines.forEach(t => ed.steps.push({ t }));
  else if (p.kind === 'other') ed.alts = [...(ed.alts || []), { text: lines.join('. '), by: p.by || '' }];
  if (p.by && !(ed.credits || []).includes(p.by)) ed.credits = [...(ed.credits || []), p.by];
  const what = { new:'новая карточка уже заполнена', add:'шаги добавлены в конец', other:'способ добавлен в «Ещё помогало коллегам»', fix:`поправьте шаг ${p.step} вручную` }[p.kind] || '';
  return `<div class="fix" role="note">${ic('bulb',20)}<div><b>Предложение от ${esc(p.by || 'сотрудника')}: ${esc(what)}</b><span>${esc(lines.join(' → '))}</span><span class="hint">Проверьте, поправьте формулировки и сохраните.</span></div></div>`;
}

/* --- QR для наклейки на устройство --- */
function viewQR(id){
  const c = byId(id); if (!c) return viewStats();
  const url = location.href.split('#')[0] + '#c-' + id;
  app.innerHTML = `<div class="view">
    ${backLink('stats', 'Для IT')}
    <div class="card-head"><span class="eyebrow brass">Наклейка на устройство</span><h2>${esc(c.title)}</h2>
      <p>Сохраните картинку (долгое нажатие) и распечатайте. Сканируют камерой телефона и сразу попадают в инструкцию.</p></div>
    <div class="qr" id="qr"><div class="empty">Готовлю QR…</div></div>
    <div class="note" style="overflow-wrap:anywhere">${esc(url)}</div>
    ${footer()}</div>`;
  const draw = () => {
    try {
      const q = qrcode(0, 'M'); q.addData(url); q.make();
      document.getElementById('qr').innerHTML = `<img alt="QR-код инструкции" src="${q.createDataURL(8, 2)}"><span class="qt">${esc(c.title)}</span><span class="eyebrow">Отсканируйте камерой · IT-помощь</span>`;
    } catch(e){ document.getElementById('qr').innerHTML = '<div class="empty">Не получилось построить QR.</div>'; }
  };
  if (window.qrcode) return draw();
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
  s.onload = draw;
  s.onerror = () => { const el = document.getElementById('qr'); if (el) el.innerHTML = '<div class="empty">Для QR нужен интернет. Подключитесь и откройте экран ещё раз.</div>'; };
  document.head.appendChild(s);
}

/* --- установка на телефон --- */
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; renderInstall(); });
function renderInstall(){
  const box = document.getElementById('install'); if (!box) return;
  const standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  if (standalone || store.get('installHidden', false)) { box.innerHTML = ''; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  let html = '';
  if (deferredPrompt) html = `<div class="banner"><span class="tx">Поставьте приложение на телефон: откроется одним тапом и без интернета.</span><button class="btn small" id="inst" type="button">Установить</button></div>`;
  else if (ios) html = `<div class="banner"><span class="brass" style="display:flex">${ic('share',20)}</span><span class="tx">Нажмите «Поделиться», затем «На экран „Домой“».</span><button class="icon-btn" id="hide" type="button" aria-label="Скрыть">${ic('x',16)}</button></div>`;
  box.innerHTML = html;
  const inst = document.getElementById('inst');
  if (inst) inst.onclick = async () => { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; renderInstall(); };
  const hide = document.getElementById('hide');
  if (hide) hide.onclick = () => { store.set('installHidden', true); renderInstall(); };
}

/* --- навигация: «назад» возвращает туда, откуда пришёл --- */
let depth = 0;
app.addEventListener('click', e => {
  const b = e.target.closest('[data-back]');
  if (b && depth > 0){ e.preventDefault(); history.back(); return; }
  const s = e.target.closest('#size');
  if (s){ bigText = !bigText; store.set('big', bigText); app.classList.toggle('big', bigText); s.setAttribute('aria-pressed', bigText); }
});
function route(){
  const h = location.hash.replace('#','');
  if (h.startsWith('c-')) viewCard(h.slice(2));
  else if (h.startsWith('d-')) viewDept(h.slice(2));
  else if (h.startsWith('qr-')) viewQR(h.slice(3));
  else if (h === 'stats') viewStats();
  else if (h === 'admin') viewAdmin();
  else if (h === 'suggest' || h.startsWith('suggest-')) viewSuggest(h.slice(8));
  else if (h.startsWith('edit-')) viewEdit(h.slice(5));
  else if (h === 'ticket' || h.startsWith('ticket-')) viewTicket(h.slice(7));
  else if (h === 'call') viewCall();
  else viewHome();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { depth++; route(); });
window.addEventListener('online', route); window.addEventListener('offline', route);
route();

/* --- офлайн-режим и обновления (работает, когда приложение открыто с сайта) --- */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  try {
    navigator.serviceWorker.register('sw.js').then(reg => {
      const notify = () => {
        if (!reg.waiting || document.getElementById('upd')) return;
        const bar = document.createElement('div');
        bar.id = 'upd'; bar.className = 'banner';
        bar.style.cssText = 'position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:var(--shadow)';
        bar.innerHTML = '<span class="tx">Инструкции обновились.</span><button class="btn small" type="button">Обновить</button>';
        bar.querySelector('button').onclick = () => reg.waiting.postMessage('skipWaiting');
        document.body.appendChild(bar);
      };
      notify();
      reg.addEventListener('updatefound', () => reg.installing && reg.installing.addEventListener('statechange', notify));
    }).catch(() => {});
    let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!reloaded){ reloaded = true; location.reload(); } });
  } catch(e) {}
}
</script>
